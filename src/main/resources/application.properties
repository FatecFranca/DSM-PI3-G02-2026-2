spring.application.name=Pizzaria
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pizzaria}
spring.data.mongodb.auto-index-creation=true

# Somente para inicializar um banco sem colaboradores (configure via variáveis de ambiente).
bootstrap.admin.nome=${BOOTSTRAP_ADMIN_NOME:}
bootstrap.admin.matricula=${BOOTSTRAP_ADMIN_MATRICULA:}
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
bootstrap.admin.senha=${BOOTSTRAP_ADMIN_SENHA:}

# Para recuperar senha por e-mail, configure um servidor SMTP real.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${SMTP_FROM:${SMTP_USERNAME:}}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

# Preco-base da pizza assada (inteira ou meio a meio).
app.pizza.preco-base=${PIZZA_PRECO_BASE:60.00}

# Preco da pizza pre-assada (inteira ou meio a meio).
app.pizza.preco-pre-assada=${PIZZA_PRECO_PRE_ASSADA:50.00}

# Taxa fixa de entrega (para retirada, a taxa e zero).
app.pedido.taxa-entrega=${TAXA_ENTREGA:7.00}
